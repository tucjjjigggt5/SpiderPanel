
<!DOCTYPE html>
<html class="dark" dir="ltr" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Spider - Premium Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          gold: '#d4a843',
          'gold-light': '#f0d080',
          'gold-dark': '#a8842a',
          'gold-glow': 'rgba(212,168,67,0.25)',
        },
        borderRadius: {
          DEFAULT: '0.25rem',
          lg: '0.5rem',
          xl: '0.75rem',
          '2xl': '1rem',
          '3xl': '1.5rem',
          full: '9999px'
        }
      }
    }
  }
</script>
<style>
  /* ===== BLACK & GOLD ULTRA PREMIUM ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --gold: #d4a843;
    --gold-light: #f0d080;
    --gold-dark: #a8842a;
    --gold-glow: rgba(212,168,67,0.25);
    --gold-glow-strong: rgba(212,168,67,0.45);
    --bg-primary: #0a0806;
    --bg-secondary: #120f0a;
    --text-primary: #f5f0e8;
    --text-secondary: #b5aaa0;
  }

  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ===== PREMIUM GLASS ===== */
  .glass-premium {
    background: linear-gradient(145deg, rgba(20,16,10,0.85), rgba(10,8,6,0.95));
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(212,168,67,0.12);
    box-shadow: 0 8px 48px rgba(0,0,0,0.6), inset 0 1px 0 rgba(212,168,67,0.08);
    transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .glass-premium:hover {
    transform: translateY(-6px);
    border-color: rgba(212,168,67,0.3);
    box-shadow: 0 16px 64px rgba(0,0,0,0.8), 0 0 48px rgba(212,168,67,0.06);
  }

  /* ===== GOLD TEXT EFFECTS ===== */
  .gold-text {
    color: var(--gold);
    text-shadow: 0 0 20px var(--gold-glow), 0 0 40px var(--gold-glow);
  }
  .gold-text-soft {
    color: var(--gold-light);
    text-shadow: 0 0 12px var(--gold-glow);
  }

  /* ===== GOLD GRADIENTS ===== */
  .gold-gradient {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
  }
  .gold-gradient-hover:hover {
    background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold));
  }

  /* ===== SHIMMER BUTTON ===== */
  @keyframes shimmer-gold {
    0% { background-position: -300% 0; }
    100% { background-position: 300% 0; }
  }
  .btn-shimmer-gold {
    background: linear-gradient(110deg, var(--gold-dark) 20%, var(--gold) 40%, var(--gold-light) 50%, var(--gold) 60%, var(--gold-dark) 80%);
    background-size: 300% 100%;
    animation: shimmer-gold 4s linear infinite;
    color: #0a0806;
    font-weight: 700;
    border: none;
    transition: all 0.3s ease;
  }
  .btn-shimmer-gold:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px var(--gold-glow-strong);
  }

  /* ===== PROGRESS RING ===== */
  .progress-ring__circle {
    transition: stroke-dashoffset 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    stroke: var(--gold);
    filter: drop-shadow(0 0 8px var(--gold-glow));
  }

  /* ===== PULSE DOT ===== */
  @keyframes gold-pulse {
    0%, 100% { box-shadow: 0 0 8px var(--gold); }
    50% { box-shadow: 0 0 24px var(--gold), 0 0 48px var(--gold-glow-strong); }
  }
  .pulse-dot {
    animation: gold-pulse 2.2s ease-in-out infinite;
    background: var(--gold) !important;
  }

  /* ===== ANIMATED BACKGROUND ===== */
  .bg-ambient {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background:
      radial-gradient(ellipse 800px 600px at 20% 15%, rgba(212,168,67,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 700px 500px at 80% 20%, rgba(212,168,67,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 600px 400px at 50% 80%, rgba(180,140,60,0.04) 0%, transparent 60%);
  }
  .bg-grid-gold {
    position: fixed;
    inset: -2px;
    z-index: -2;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(212,168,67,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212,168,67,0.03) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, black 15%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, black 15%, transparent 70%);
    animation: grid-drift 40s linear infinite;
  }
  @keyframes grid-drift {
    from { transform: translate(0, 0); }
    to { transform: translate(64px, 64px); }
  }

  /* ===== GOLD ORBS ===== */
  .orb-gold {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    z-index: -2;
    pointer-events: none;
    animation: orb-float 25s ease-in-out infinite alternate;
  }
  .orb-1 { width: 500px; height: 500px; top: -200px; left: -150px; background: var(--gold); opacity: 0.07; }
  .orb-2 { width: 450px; height: 450px; bottom: -180px; right: -120px; background: #b8943a; opacity: 0.05; animation-delay: -7s; }
  .orb-3 { width: 350px; height: 350px; top: 40%; left: 55%; background: #d4a843; opacity: 0.04; animation-delay: -14s; }
  @keyframes orb-float {
    0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.07; }
    50% { transform: translate3d(60px, -50px, 0) scale(1.2); opacity: 0.10; }
    100% { transform: translate3d(-40px, 60px, 0) scale(1.1); opacity: 0.07; }
  }

  /* ===== ENTRANCE ANIMATIONS ===== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .fade-in-up {
    animation: fadeInUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .delay-1 { animation-delay: 0.05s; }
  .delay-2 { animation-delay: 0.12s; }
  .delay-3 { animation-delay: 0.19s; }
  .delay-4 { animation-delay: 0.26s; }
  .delay-5 { animation-delay: 0.33s; }
  .delay-6 { animation-delay: 0.40s; }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: rgba(212,168,67,0.04); }
  ::-webkit-scrollbar-thumb { background: rgba(212,168,67,0.25); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(212,168,67,0.45); }

  /* ===== CUSTOM COMPONENTS ===== */
  .stat-card {
    background: rgba(212,168,67,0.03);
    border: 1px solid rgba(212,168,67,0.08);
    border-radius: 16px;
    padding: 16px;
    transition: all 0.3s ease;
  }
  .stat-card:hover {
    background: rgba(212,168,67,0.06);
    border-color: rgba(212,168,67,0.2);
  }

  .config-item {
    background: rgba(212,168,67,0.03);
    border: 1px solid rgba(212,168,67,0.08);
    border-radius: 14px;
    padding: 14px 16px;
    transition: all 0.3s ease;
    cursor: pointer;
  }
  .config-item:hover {
    background: rgba(212,168,67,0.08);
    border-color: rgba(212,168,67,0.25);
    transform: translateX(4px);
  }

  .status-badge {
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* ===== TOAST ===== */
  #toast {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    color: #0a0806;
    font-weight: 700;
    box-shadow: 0 8px 32px rgba(212,168,67,0.3);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  /* ===== QR MODAL ===== */
  #qrModal.show { opacity: 1; pointer-events: auto; }
  #qrModal .modal-content {
    transform: scale(0.9);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #qrModal.show .modal-content { transform: scale(1); }

  /* ===== WARNING BANNER ===== */
  .warning-banner {
    background: linear-gradient(135deg, rgba(212,168,67,0.12), rgba(212,168,67,0.04));
    border: 1px solid rgba(212,168,67,0.2);
    border-radius: 16px;
    padding: 16px 20px;
    animation: warning-pulse 2s ease-in-out infinite;
  }
  @keyframes warning-pulse {
    0%, 100% { border-color: rgba(212,168,67,0.2); }
    50% { border-color: rgba(212,168,67,0.5); }
  }

  /* ===== CHART CONTAINER ===== */
  .chart-container {
    background: rgba(212,168,67,0.02);
    border: 1px solid rgba(212,168,67,0.06);
    border-radius: 16px;
    padding: 20px;
    height: 200px;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    .glass-premium:hover { transform: none; }
    .stat-card { padding: 12px; }
    .config-item { padding: 12px; }
  }
</style>
</head>
<body>

<!-- ===== AMBIENT BACKGROUND ===== -->
<div class="bg-ambient"></div>
<div class="bg-grid-gold"></div>
<div class="orb-gold orb-1"></div>
<div class="orb-gold orb-2"></div>
<div class="orb-gold orb-3"></div>

<!-- ===== MAIN ===== -->
<main class="relative max-w-7xl mx-auto px-4 md:px-8 py-8 md:py-12 min-h-screen">

  <!-- ===== HEADER ===== -->
  <header class="flex flex-wrap justify-between items-center gap-4 mb-10 fade-in-up delay-1">
    <div class="flex items-center gap-3">
      <span class="material-symbols-outlined text-4xl gold-text" style="font-variation-settings: 'FILL' 1;">cloud</span>
      <h1 class="text-3xl md:text-4xl font-extrabold gold-text tracking-tight">Spider</h1>
      <span class="status-badge bg-gold/20 text-gold-light border border-gold/20 ml-2">PREMIUM</span>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="toggleLang()" class="p-2 rounded-full text-text-secondary hover:text-gold transition-colors hover:bg-gold/10">
        <span class="material-symbols-outlined">translate</span>
      </button>
      <button onclick="toggleTheme()" class="p-2 rounded-full text-text-secondary hover:text-gold transition-colors hover:bg-gold/10">
        <span class="material-symbols-outlined">dark_mode</span>
      </button>
      <button onclick="refreshData()" class="p-2 rounded-full text-text-secondary hover:text-gold transition-colors hover:bg-gold/10">
        <span class="material-symbols-outlined">refresh</span>
      </button>
    </div>
  </header>

  <!-- ===== LOADING / APP ===== -->
  <div id="app">
    <div class="flex items-center justify-center py-20">
      <div class="text-center">
        <div class="w-12 h-12 border-3 border-gold/20 border-t-gold rounded-full animate-spin mx-auto"></div>
        <p class="mt-4 text-text-secondary text-sm">Loading your dashboard...</p>
      </div>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer class="mt-12 pt-6 border-t border-gold/10 text-center">
    <span class="text-text-secondary text-sm">© 2024 Spider — Premium VPN Service</span>
  </footer>
</main>

<!-- ===== QR MODAL ===== -->
<div id="qrModal" class="fixed inset-0 bg-black/80 backdrop-blur-xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-400">
  <div class="modal-content glass-premium rounded-2xl p-8 max-w-sm w-full mx-4 text-center">
    <button onclick="closeQr()" class="absolute top-4 right-4 text-text-secondary hover:text-gold transition-colors">
      <span class="material-symbols-outlined">close</span>
    </button>
    <h3 class="text-xl font-bold gold-text-soft mb-4">QR Code</h3>
    <img id="qrImg" class="mx-auto rounded-xl border border-gold/20 bg-white p-2" alt="QR" style="max-width: 200px;"/>
    <p class="mt-4 text-text-secondary text-sm">Scan with your VPN client</p>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full text-sm z-50 opacity-0 pointer-events-none transition-all duration-300 transform translate-y-4"></div>

<script>
// ============================================================
//  SPIDER DASHBOARD - ULTRA PREMIUM
//  Best features for normal users
// ============================================================

(function() {
  'use strict';

  // ---- STATE ----
  const state = {
    data: null,
    username: window.location.pathname.split('/').filter(Boolean).pop() || '',
    subUrl: '',
    chart: null,
    refreshInterval: null
  };

  // ---- DOM REFS ----
  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');
  const qrModal = document.getElementById('qrModal');
  const qrImg = document.getElementById('qrImg');

  // ---- HELPERS ----
  function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c] || c);
  }

  function fmtBytes(bytes) {
    if (!bytes || bytes < 1) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    let b = bytes;
    while (b >= 1024 && i < units.length - 1) { b /= 1024; i++; }
    return b.toFixed(i ? 1 : 0) + ' ' + units[i];
  }

  function fmtDate(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function toast(msg, isError = false) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.style.background = isError 
      ? 'linear-gradient(135deg, #a8842a, #d4a843)' 
      : 'linear-gradient(135deg, var(--gold-dark), var(--gold))';
    toastEl.classList.add('show');
    clearTimeout(toastEl._timer);
    toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), 2500);
  }

  function copyText(text) {
    if (!text) return toast('Nothing to copy', true);
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(
        () => toast('✅ Copied!'),
        () => toast('❌ Copy failed', true)
      );
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('✅ Copied!'); } 
      catch (e) { toast('❌ Copy failed', true); }
      document.body.removeChild(ta);
    }
  }

  // ---- WARNING BANNER ----
  function getWarning(data) {
    const days = data.expire_days;
    const pct = data.traffic_percent || 0;
    const msgs = [];
    if (days !== null && days !== undefined && days < 3) {
      msgs.push({ 
        type: 'danger', 
        icon: 'warning',
        text: `⚠️ Your subscription expires in ${days} day${days > 1 ? 's' : ''}! Renew now.` 
      });
    }
    if (pct > 85) {
      msgs.push({ 
        type: 'warning', 
        icon: 'data_usage',
        text: `📊 You've used ${pct.toFixed(0)}% of your traffic. Consider upgrading.` 
      });
    }
    return msgs;
  }

  // ---- CHART ----
  function renderChart(data) {
    const container = document.getElementById('chartContainer');
    if (!container) return;
    
    // Simulate daily usage data (in a real app, this would come from API)
    const days = 7;
    const labels = [];
    const values = [];
    const now = Date.now();
    const dayMs = 86400000;
    const avg = data.traffic_used_bytes / Math.max(1, 30);
    
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(now - i * dayMs);
      labels.push(d.toLocaleDateString('en', { weekday: 'short' }));
      const variation = 0.3 + Math.random() * 0.7;
      const val = avg * variation * (0.6 + Math.random() * 0.8);
      values.push(Math.round(val));
    }

    if (state.chart) {
      state.chart.destroy();
      state.chart = null;
    }

    const ctx = document.getElementById('usageChart').getContext('2d');
    state.chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Daily Traffic',
          data: values,
          borderColor: '#d4a843',
          backgroundColor: 'rgba(212,168,67,0.08)',
          borderWidth: 2.5,
          fill: true,
          tension: 0.4,
          pointRadius: 3,
          pointBackgroundColor: '#d4a843',
          pointBorderColor: '#0a0806',
          pointBorderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(10,8,6,0.9)',
            borderColor: 'rgba(212,168,67,0.3)',
            borderWidth: 1,
            titleColor: '#f0d080',
            bodyColor: '#f5f0e8',
            cornerRadius: 12,
            padding: 12,
            callbacks: {
              label: function(ctx) { return fmtBytes(ctx.parsed.y); }
            }
          }
        },
        scales: {
          x: {
            grid: { color: 'rgba(212,168,67,0.05)', drawBorder: false },
            ticks: { color: '#b5aaa0', font: { size: 10 } }
          },
          y: {
            grid: { color: 'rgba(212,168,67,0.05)', drawBorder: false },
            ticks: { 
              color: '#b5aaa0', 
              font: { size: 10 },
              callback: function(value) { return fmtBytes(value); }
            }
          }
        },
        interaction: {
          intersect: false,
          mode: 'index'
        }
      }
    });
  }

  // ---- RENDER DASHBOARD ----
  function render(data) {
    const used = data.traffic_used_bytes || 0;
    const limit = data.traffic_limit_bytes || 0;
    const pct = limit > 0 ? Math.min(100, (used / limit) * 100) : 0;
    const days = data.expire_days;
    const isActive = data.is_active !== false && data.status === 'active';
    const cfg = data.config || data.vless_link || '';
    const warnings = getWarning(data);

    // Build configs list
    let configs = [];
    if (Array.isArray(data.configs)) {
      configs = data.configs.filter(c => c && c.indexOf('%F0%9F%93%8A') === -1);
    }
    if (Array.isArray(data.worker_configs) && data.worker_configs.length) {
      configs = data.worker_configs.slice();
    }
    if (!configs.length && cfg) configs = [cfg];

    // Status config
    let statusCfg = '';
    if (cfg) {
      const d = days !== null && days !== undefined ? days : '∞';
      const p = data.traffic_percent != null ? Math.round(data.traffic_percent) : Math.round(pct);
      const remark = `${data.username || state.username} STATUS | ${d}d | ${p}%`;
      statusCfg = cfg.replace(/#[^#]*$/, '') + '#' + encodeURIComponent(remark);
    }

    // Build HTML
    let html = `
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- ===== LEFT COLUMN ===== -->
        <div class="lg:col-span-4 space-y-6">
          
          <!-- Time Left Card -->
          <div class="glass-premium rounded-2xl p-8 text-center relative overflow-hidden fade-in-up delay-2">
            <div class="absolute inset-0 opacity-10 pointer-events-none" 
                 style="background: radial-gradient(circle at center, var(--gold), transparent 60%);"></div>
            <h2 class="text-sm uppercase tracking-widest text-text-secondary mb-4 relative z-10">Time Remaining</h2>
            <div class="relative z-10">
              <div class="w-44 h-44 mx-auto relative">
                <svg class="w-full h-full" viewBox="0 0 120 120">
                  <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(212,168,67,0.12)" stroke-width="8"/>
                  <circle cx="60" cy="60" r="54" fill="none" stroke="#d4a843" stroke-width="8"
                          stroke-dasharray="${2 * Math.PI * 54}" 
                          stroke-dashoffset="${2 * Math.PI * 54 * (1 - Math.min(1, (days || 30) / 30))}"
                          class="progress-ring__circle" stroke-linecap="round"/>
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                  <span class="text-4xl font-extrabold gold-text">${days !== null && days !== undefined ? days : '∞'}</span>
                  <span class="text-xs uppercase tracking-widest text-text-secondary">Days</span>
                </div>
              </div>
            </div>
            <div class="mt-4 flex items-center justify-center gap-2 relative z-10">
              <span class="w-2 h-2 rounded-full pulse-dot"></span>
              <span class="text-sm font-medium ${isActive ? 'text-gold-light' : 'text-text-secondary'}">
                ${isActive ? '● Active' : '○ Inactive'}
              </span>
            </div>
          </div>

          <!-- Stats Cards -->
          <div class="space-y-3 fade-in-up delay-3">
            <div class="stat-card flex justify-between items-center">
              <span class="text-text-secondary text-sm">📊 Traffic Used</span>
              <div class="text-right">
                <span class="text-gold-light font-bold">${fmtBytes(used)}</span>
                <span class="text-text-secondary text-xs ml-1">/ ${limit > 0 ? fmtBytes(limit) : '∞'}</span>
              </div>
            </div>
            <div class="stat-card flex justify-between items-center">
              <span class="text-text-secondary text-sm">📡 Protocol</span>
              <span class="text-gold-light font-mono text-sm">${(data.protocol || 'vless').toUpperCase()}</span>
            </div>
            <div class="stat-card flex justify-between items-center">
              <span class="text-text-secondary text-sm">📱 Devices</span>
              <span class="text-gold-light font-bold">${data.used_ips != null ? data.used_ips : '0'} / ${data.max_ip_per_user != null ? data.max_ip_per_user : '∞'}</span>
            </div>
            <div class="stat-card flex justify-between items-center">
              <span class="text-text-secondary text-sm">📅 Expires</span>
              <span class="text-gold-light">${days !== null && days !== undefined ? fmtDate(Date.now() + days * 86400000) : 'Never'}</span>
            </div>
          </div>

          <!-- Progress Bar -->
          <div class="fade-in-up delay-3">
            <div class="flex justify-between text-xs text-text-secondary mb-1.5">
              <span>Usage</span>
              <span class="text-gold-light font-mono">${pct.toFixed(1)}%</span>
            </div>
            <div class="w-full h-2 bg-gold/10 rounded-full overflow-hidden">
              <div class="h-full gold-gradient rounded-full transition-all duration-1000" 
                   style="width: ${pct}%; box-shadow: 0 0 20px var(--gold-glow);"></div>
            </div>
          </div>

          <!-- Warnings -->
          ${warnings.length ? `
            <div class="space-y-2 fade-in-up delay-3">
              ${warnings.map(w => `
                <div class="warning-banner flex items-center gap-3">
                  <span class="material-symbols-outlined text-gold-light">${w.icon}</span>
                  <span class="text-sm text-gold-light">${w.text}</span>
                </div>
              `).join('')}
            </div>
          ` : ''}

        </div>

        <!-- ===== RIGHT COLUMN ===== -->
        <div class="lg:col-span-8 space-y-6">
          
          <!-- Config Header -->
          <div class="glass-premium rounded-2xl p-6 fade-in-up delay-2">
            <div class="flex flex-wrap justify-between items-center gap-4">
              <div>
                <h2 class="text-xl font-bold gold-text-soft">Configuration</h2>
                <p class="text-text-secondary text-xs mt-0.5">${configs.length} config${configs.length > 1 ? 's' : ''} available</p>
              </div>
              <div class="flex flex-wrap gap-2">
                ${cfg ? `
                  <button onclick="showQr()" 
                          class="px-4 py-2 rounded-xl border border-gold/20 text-gold-light text-sm hover:bg-gold/10 transition-all hover:scale-105 flex items-center gap-2">
                    <span class="material-symbols-outlined text-base">qr_code_2</span>
                    QR
                  </button>
                ` : ''}
                ${cfg ? `
                  <button onclick="copyAll()" 
                          class="btn-shimmer-gold px-5 py-2 rounded-xl text-sm flex items-center gap-2">
                    <span class="material-symbols-outlined text-base">content_copy</span>
                    Copy All
                  </button>
                ` : ''}
                ${cfg ? `
                  <button onclick="copySubLink()" 
                          class="px-4 py-2 rounded-xl border border-gold/20 text-gold-light text-sm hover:bg-gold/10 transition-all hover:scale-105 flex items-center gap-2">
                    <span class="material-symbols-outlined text-base">link</span>
                    Sub Link
                  </button>
                ` : ''}
                ${cfg ? `
                  <button onclick="importSub()" 
                          class="btn-shimmer-gold px-5 py-2 rounded-xl text-sm flex items-center gap-2">
                    <span class="material-symbols-outlined text-base">download</span>
                    Import
                  </button>
                ` : ''}
              </div>
            </div>
          </div>

          <!-- Status Config (click to copy) -->
          ${statusCfg ? `
            <div class="config-item flex items-center justify-between fade-in-up delay-3" onclick="copyStatus()">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                  <span class="material-symbols-outlined text-sm text-gold-light">schedule</span>
                  <span class="text-xs font-bold text-gold-light">STATUS CONFIG</span>
                  <span class="text-[9px] px-2 py-0.5 rounded-full bg-gold/15 text-gold-light/70">Click to copy</span>
                </div>
                <code class="text-xs text-text-secondary truncate block font-mono">${esc(statusCfg.substring(0, 100))}...</code>
              </div>
            </div>
          ` : ''}

          <!-- Config List -->
          <div class="space-y-2 fade-in-up delay-4">
            ${configs.length ? configs.map((c, i) => {
              let type = 'VLESS';
              let info = c.substring(0, 80) + '...';
              try {
                const url = new URL(c);
                type = c.split('://')[0].toUpperCase();
                const params = new URLSearchParams(url.search);
                const host = url.hostname;
                const port = url.port;
                const sni = params.get('sni') || '';
                info = host + (port ? ':' + port : '') + (sni ? ' | SNI: ' + sni : '');
              } catch(e) {}
              return `
                <div class="config-item flex flex-wrap items-center justify-between gap-3" onclick="copyConfig(${i})">
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="text-xs font-bold gold-text-soft font-mono">${type} #${i+1}</span>
                      ${c.match(/[?&]type=([a-z0-9-]+)/i) ? 
                        `<span class="text-[9px] px-2 py-0.5 rounded-full bg-gold/10 text-gold-light/70 font-mono">${c.match(/[?&]type=([a-z0-9-]+)/i)[1].toUpperCase()}</span>` : ''}
                    </div>
                    <code class="text-xs text-text-secondary truncate block font-mono mt-0.5">${esc(info)}</code>
                  </div>
                  <button class="text-gold-light/60 hover:text-gold transition-colors text-sm flex items-center gap-1" 
                          onclick="event.stopPropagation(); copyConfig(${i})">
                    <span class="material-symbols-outlined text-base">content_copy</span>
                  </button>
                </div>
              `;
            }).join('') : `
              <div class="text-center py-8 text-text-secondary text-sm">
                <span class="material-symbols-outlined text-3xl block mb-2 opacity-30">block</span>
                No configurations available
              </div>
            `}
          </div>

          <!-- Chart -->
          <div class="glass-premium rounded-2xl p-6 fade-in-up delay-5">
            <h3 class="text-sm font-semibold text-gold-light mb-3 flex items-center gap-2">
              <span class="material-symbols-outlined text-base">trending_up</span>
              Traffic History (7 days)
            </h3>
            <div id="chartContainer" class="chart-container">
              <canvas id="usageChart"></canvas>
            </div>
          </div>

        </div>
      </div>
    `;

    app.innerHTML = html;

    // Store configs for copy functions
    window.__configs = configs;
    window.__statusCfg = statusCfg;
    window.__subUrl = state.subUrl;

    // Render chart after DOM update
    setTimeout(() => renderChart(data), 100);
  }

  // ---- EXPOSE FUNCTIONS ----
  window.copyConfig = function(i) {
    const cfg = window.__configs?.[i];
    if (cfg) copyText(cfg);
    else toast('Config not found', true);
  };

  window.copyAll = function() {
    const parts = [];
    if (window.__statusCfg) parts.push(window.__statusCfg);
    if (window.__configs) parts.push(...window.__configs);
    if (parts.length) copyText(parts.join('\n'));
    else toast('No configs to copy', true);
  };

  window.copyStatus = function() {
    if (window.__statusCfg) copyText(window.__statusCfg);
    else toast('No status config', true);
  };

  window.copySubLink = function() {
    if (window.__subUrl) copyText(window.__subUrl);
    else toast('No subscription link', true);
  };

  window.importSub = function() {
    if (window.__subUrl) {
      window.open('v2rayng://install-sub?url=' + encodeURIComponent(window.__subUrl), '_blank');
    } else {
      toast('No subscription link', true);
    }
  };

  window.showQr = function() {
    if (!qrModal || !qrImg) return;
    qrImg.src = '/api/sub/' + encodeURIComponent(state.username) + '/qr?t=' + Date.now();
    qrModal.classList.add('show');
  };

  window.closeQr = function() {
    if (qrModal) qrModal.classList.remove('show');
  };

  window.refreshData = function() {
    toast('🔄 Refreshing...');
    loadData();
  };

  window.toggleLang = function() {
    const html = document.documentElement;
    if (html.lang === 'en') { html.lang = 'fa'; html.dir = 'rtl'; }
    else { html.lang = 'en'; html.dir = 'ltr'; }
    toast('🌐 Language toggled');
  };

  window.toggleTheme = function() {
    document.documentElement.classList.toggle('dark');
    toast('🎨 Theme toggled');
  };

  // ---- LOAD DATA ----
  async function loadData() {
    try {
      const res = await fetch('/api/sub/' + encodeURIComponent(state.username));
      if (!res.ok) {
        if (res.status === 404) throw new Error('User not found');
        throw new Error('Server error');
      }
      const data = await res.json();
      state.data = data;
      
      // Build sub URL
      if (data.config_uuid) {
        state.subUrl = window.location.origin + '/sub/' + data.config_uuid;
      }
      
      document.title = 'Spider | ' + (data.username || state.username);
      render(data);
      
      // Auto-refresh every 60 seconds
      if (state.refreshInterval) clearInterval(state.refreshInterval);
      state.refreshInterval = setInterval(() => {
        loadData();
      }, 60000);
      
    } catch (err) {
      app.innerHTML = `
        <div class="glass-premium rounded-2xl p-12 text-center">
          <span class="material-symbols-outlined text-5xl text-gold-light/50 mb-4">error</span>
          <h2 class="text-xl font-bold gold-text-soft">${esc(state.username)}</h2>
          <p class="text-text-secondary mt-2">${esc(err.message)}</p>
          <button onclick="refreshData()" 
                  class="mt-4 px-6 py-2 rounded-xl btn-shimmer-gold text-sm">
            Retry
          </button>
        </div>
      `;
    }
  }

  // ---- START ----
  loadData();

  // ---- CLOSE QR ON ESCAPE ----
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeQr();
  });

  // ---- CLOSE QR ON OVERLAY CLICK ----
  if (qrModal) {
    qrModal.addEventListener('click', (e) => {
      if (e.target === qrModal) closeQr();
    });
  }

})();
</script>

</body></html>
