<!DOCTYPE html>
<html class="dark" dir="ltr" lang="fa">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Black Gold Luxury | Spider</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet"/>
    
    <style>
        /* ================================================================
           BLACK GOLD LUXURY — طراحی منحصربه‌فرد با طلای سیاه و الماس
           ================================================================ */

        body {
            background: #0a0a0a;
            color: #e8e8e8;
            -webkit-font-smoothing: antialiased;
            font-family: 'Inter', sans-serif;
            position: relative;
            min-height: 100vh;
        }

        /* ── پس‌زمینه طلای سیاه ── */
        .bg-black-gold {
            position: fixed;
            inset: 0;
            z-index: -3;
            background: 
                radial-gradient(ellipse 1200px 800px at 30% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse 800px 600px at 70% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse 500px 500px at 50% 50%, rgba(255, 215, 0, 0.03) 0%, transparent 70%),
                #0a0a0a;
        }

        /* ── شبکه طلایی ── */
        .gold-grid {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(212, 175, 55, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 175, 55, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, black 20%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, black 20%, transparent 70%);
            animation: goldGridDrift 40s linear infinite;
        }
        @keyframes goldGridDrift {
            from { background-position: 0 0; }
            to   { background-position: 60px 60px; }
        }

        /* ── اورب‌های طلایی ── */
        .gold-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            pointer-events: none;
            animation: goldOrbFloat 20s ease-in-out infinite alternate;
            will-change: transform, opacity;
        }
        .gold-orb-1 {
            width: 600px; height: 600px;
            top: -200px; left: -150px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.25), rgba(212, 175, 55, 0.05));
            animation-delay: 0s;
        }
        .gold-orb-2 {
            width: 500px; height: 500px;
            bottom: -180px; right: -120px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.20), rgba(212, 175, 55, 0.04));
            animation-delay: -6s;
        }
        .gold-orb-3 {
            width: 400px; height: 400px;
            top: 40%; left: 60%;
            background: radial-gradient(circle, rgba(184, 134, 11, 0.18), transparent);
            animation-delay: -12s;
        }
        .gold-orb-4 {
            width: 350px; height: 350px;
            bottom: 30%; left: 10%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.12), transparent);
            animation-delay: -18s;
        }
        @keyframes goldOrbFloat {
            from { transform: translate3d(0, 0, 0) scale(1); opacity: 0.6; }
            50%  { transform: translate3d(60px, -50px, 0) scale(1.2); opacity: 0.8; }
            to   { transform: translate3d(-40px, 40px, 0) scale(1.1); opacity: 0.6; }
        }

        /* ── پنل شیشه‌ای طلایی ── */
        .glass-gold {
            background: rgba(10, 10, 12, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 
                0 8px 40px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(212, 175, 55, 0.08),
                0 0 30px rgba(212, 175, 55, 0.03);
            transition: all 0.4s cubic-bezier(.22,1,.36,1);
        }
        .glass-gold:hover {
            border-color: rgba(212, 175, 55, 0.3);
            box-shadow: 
                0 12px 50px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(212, 175, 55, 0.12),
                0 0 50px rgba(212, 175, 55, 0.06);
            transform: translateY(-3px);
        }

        /* ── متن طلایی ── */
        .text-gold {
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
        }
        .text-gold-light {
            color: #f0d080;
        }
        .text-gold-dark {
            color: #b8961e;
        }

        /* ── هدر طلایی ── */
        .gold-header {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.08), rgba(10, 10, 12, 0.9));
            border-bottom: 1px solid rgba(212, 175, 55, 0.12);
        }

        /* ── دکمه طلایی ── */
        .btn-gold {
            background: linear-gradient(135deg, #d4af37, #b8961e, #d4af37);
            background-size: 200% 100%;
            color: #0a0a0a;
            border: none;
            font-weight: 700;
            transition: all 0.3s ease;
            animation: goldShimmer 4s linear infinite;
        }
        .btn-gold:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
        }
        @keyframes goldShimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* ── دکمه طلایی خالی ── */
        .btn-gold-outline {
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #d4af37;
            transition: all 0.3s ease;
        }
        .btn-gold-outline:hover {
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.08);
        }

        /* ── حلقه پیشرفت طلایی ── */
        .ring-gold .progress-ring__circle {
            stroke: #d4af37;
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4));
        }
        .ring-gold .ring-bg {
            stroke: rgba(212, 175, 55, 0.08);
        }

        /* ── نقطه نبض طلایی ── */
        .pulse-dot-gold {
            animation: goldPulse 2s ease-in-out infinite;
            background: #d4af37 !important;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
        }
        @keyframes goldPulse {
            0%, 100% { box-shadow: 0 0 8px rgba(212, 175, 55, 0.3); }
            50% { box-shadow: 0 0 25px rgba(212, 175, 55, 0.6); }
        }

        /* ── برچسب طلایی ── */
        .gold-tag {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.12);
            color: #d4af37;
        }

        /* ── خط جداکننده طلایی ── */
        .gold-divider {
            border-color: rgba(212, 175, 55, 0.08);
        }

        /* ── اسکرولبار طلایی ── */
        .scroll-gold::-webkit-scrollbar-track { background: rgba(212, 175, 55, 0.03); }
        .scroll-gold::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.15); border-radius: 4px; }
        .scroll-gold::-webkit-scrollbar-thumb:hover { background: rgba(212, 175, 55, 0.25); }
        .scroll-gold::-webkit-scrollbar { width: 4px; }

        /* ── انیمیشن ورود ── */
        @keyframes goldRise {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .gold-rise { animation: goldRise 0.8s cubic-bezier(.22,1,.36,1) both; }
        .gold-rise-1 { animation-delay: 0.05s; }
        .gold-rise-2 { animation-delay: 0.12s; }
        .gold-rise-3 { animation-delay: 0.19s; }
        .gold-rise-4 { animation-delay: 0.26s; }
        .gold-rise-5 { animation-delay: 0.33s; }

        /* ── الماس درخشان ── */
        .diamond {
            background: linear-gradient(135deg, #d4af37, #f0d080, #d4af37, #b8961e);
            background-size: 300% 300%;
            animation: diamondShine 3s ease-in-out infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        @keyframes diamondShine {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ── کارت کانفیگ طلایی ── */
        .cfg-card-gold {
            background: rgba(10, 10, 12, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.06);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .cfg-card-gold::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(to bottom, #d4af37, #b8961e, #d4af37);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .cfg-card-gold:hover {
            border-color: rgba(212, 175, 55, 0.15);
            background: rgba(10, 10, 12, 0.8);
        }
        .cfg-card-gold:hover::before {
            opacity: 1;
        }

        /* ── فوتتر ── */
        .gold-footer {
            border-top: 1px solid rgba(212, 175, 55, 0.06);
        }

        /* ── تگ زبان ── */
        .lang-tag {
            color: rgba(212, 175, 55, 0.5);
            font-size: 11px;
            letter-spacing: 0.1em;
        }

        /* ── هاله ماوس ── */
        .gold-trail {
            position: fixed;
            width: 400px;
            height: 400px;
            margin: -200px 0 0 -200px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, transparent 70%);
            filter: blur(15px);
            opacity: 0;
            transition: opacity 0.3s ease;
            will-change: transform;
        }
        .gold-trail.visible { opacity: 1; }

        /* ── لوگو اسپایدر طلایی ── */
        .spider-gold {
            background: linear-gradient(135deg, #d4af37, #f0d080, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }
    </style>
</head>
<body>

<!-- ====== BACKGROUND LAYERS ====== -->
<div class="bg-black-gold"></div>
<div class="gold-grid"></div>
<div class="gold-orb gold-orb-1"></div>
<div class="gold-orb gold-orb-2"></div>
<div class="gold-orb gold-orb-3"></div>
<div class="gold-orb gold-orb-4"></div>
<div class="gold-trail" id="goldTrail"></div>

<!-- ====== MAIN ====== -->
<main class="relative z-10 w-full max-w-7xl mx-auto px-4 md:px-8 py-8 min-h-screen flex flex-col">

    <!-- ====== HEADER ====== -->
    <header class="glass-gold rounded-2xl p-4 md:p-6 flex justify-between items-center mb-8 gold-rise gold-rise-1">
        <div class="flex items-center gap-4">
            <span class="material-symbols-outlined text-4xl text-gold" style="font-variation-settings: 'FILL' 1;">diamond</span>
            <div>
                <h1 class="text-2xl md:text-3xl font-bold spider-gold tracking-wider">BLACK GOLD</h1>
                <p class="text-xs text-gold/50 tracking-[0.2em] uppercase">Luxury Subscription</p>
            </div>
        </div>
        <div class="flex gap-3 items-center">
            <button onclick="toggleLang()" class="text-gold/60 hover:text-gold transition-colors p-2 rounded-full hover:bg-white/5">
                <span class="material-symbols-outlined text-2xl">translate</span>
            </button>
            <button onclick="toggleTheme()" class="text-gold/60 hover:text-gold transition-colors p-2 rounded-full hover:bg-white/5">
                <span class="material-symbols-outlined text-2xl">dark_mode</span>
            </button>
            <div class="hidden md:block h-8 w-px bg-gold/10"></div>
            <span class="lang-tag hidden md:block">✦ LUXE</span>
        </div>
    </header>

    <!-- ====== CONTENT ====== -->
    <div id="app" class="grid grid-cols-1 md:grid-cols-12 gap-6 flex-1">
        <div class="md:col-span-12 flex items-center justify-center py-20">
            <div class="text-center">
                <div class="inline-block w-12 h-12 border-2 border-gold/20 border-t-gold rounded-full animate-spin"></div>
                <p class="mt-4 text-sm text-gold/40 tracking-widest uppercase">Loading Luxe Config...</p>
            </div>
        </div>
    </div>

    <!-- ====== FOOTER ====== -->
    <footer class="gold-footer mt-8 pt-6 text-center text-gold/30 text-xs tracking-[0.15em]">
        <span>✦ BLACK GOLD LUXURY ✦</span>
        <span class="mx-3">|</span>
        <span>© 2024 Spider</span>
        <span class="mx-3">|</span>
        <span class="text-gold/20">Excellence in Every Detail</span>
    </footer>
</main>

<!-- ====== QR MODAL ====== -->
<div id="qrModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="glass-gold rounded-2xl p-8 max-w-sm w-full mx-4 text-center relative">
        <button onclick="closeQr()" class="absolute top-3 right-3 text-gold/40 hover:text-gold transition-colors">
            <span class="material-symbols-outlined">close</span>
        </button>
        <h3 class="text-xl font-bold text-gold mb-4 tracking-wider">✦ QR CODE ✦</h3>
        <img id="qrImg" class="mx-auto rounded-lg border border-gold/10 bg-black" alt="QR Code" style="max-width: 200px;"/>
        <p class="mt-4 text-sm text-gold/40 tracking-widest">SCAN TO IMPORT</p>
    </div>
</div>

<!-- ====== TOAST ====== -->
<div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-8 py-3 rounded-full bg-gold text-black text-sm z-50 opacity-0 transition-opacity pointer-events-none font-bold tracking-wide">
    ✦ Copied ✦
</div>

<!-- ====== SCRIPTS ====== -->
<script>
(function() {
    // ── GOLD TRAIL ──
    var trail = document.getElementById('goldTrail');
    var tx = -999, ty = -999, cx = -999, cy = -999;
    var active = false;
    document.addEventListener('mousemove', function(e) {
        tx = e.clientX; ty = e.clientY;
        if (!active) { active = true; trail.classList.add('visible'); }
    });
    document.addEventListener('mouseleave', function() { active = false; trail.classList.remove('visible'); });
    function loop() {
        cx += (tx - cx) * 0.1;
        cy += (ty - cy) * 0.1;
        trail.style.transform = 'translate3d(' + cx + 'px,' + cy + 'px,0)';
        requestAnimationFrame(loop);
    }
    loop();

    // ── TOGGLE ──
    window.toggleTheme = function() {
        document.documentElement.classList.toggle('dark');
    };
    window.toggleLang = function() {
        var html = document.documentElement;
        if (html.lang === 'fa') {
            html.lang = 'en';
            html.dir = 'ltr';
        } else {
            html.lang = 'fa';
            html.dir = 'rtl';
        }
    };
    window.closeQr = function() {
        document.getElementById('qrModal').classList.remove('show');
    };

    // ── TOAST ──
    function toast(msg) {
        var t = document.getElementById('toast');
        t.textContent = '✦ ' + msg + ' ✦';
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(function() { t.classList.remove('show'); }, 2000);
    }

    // ── COPY ──
    window.copyText = function(text) {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(function() { toast('Copied'); });
        } else {
            var ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); toast('Copied'); } catch(e) {}
            document.body.removeChild(ta);
        }
    };

    // ── RENDER ──
    function render(d) {
        var uname = window.location.pathname.split('/').filter(Boolean).pop() || 'user';
        var used = d.traffic_used_bytes || 0;
        var limit = d.traffic_limit_bytes || 0;
        var pct = limit > 0 ? Math.min(100, used / limit * 100) : 0;
        var days = (d.expire_days === null || d.expire_days === undefined) ? '∞' : d.expire_days;
        var isActive = d.is_active !== false && d.status === 'active';

        function fmt(b) {
            if (!b || b < 1) return '0 B';
            var u = ['B', 'KB', 'MB', 'GB', 'TB'];
            var i = 0;
            while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
            return b.toFixed(i ? 2 : 0) + ' ' + u[i];
        }

        function ring(daysVal) {
            var r = 54, c = 2 * Math.PI * r;
            var maxD = 30;
            var p = maxD > 0 ? Math.min(1, daysVal / maxD) : 1;
            var off = c * (1 - p);
            var num = daysVal === '∞' ? '∞' : String(daysVal);
            return '<div class="relative w-44 h-44 md:w-48 md:h-48 mx-auto flex items-center justify-center">' +
                '<svg class="w-full h-full" viewBox="0 0 120 120">' +
                '<circle class="ring-bg" cx="60" cy="60" fill="transparent" r="54" stroke-width="6" stroke="rgba(212,175,55,0.08)"></circle>' +
                '<circle class="progress-ring__circle" cx="60" cy="60" fill="transparent" r="54" stroke-dasharray="' + c.toFixed(3) + '" stroke-dashoffset="' + off.toFixed(3) + '" stroke-linecap="round" stroke-width="6" style="stroke:#d4af37;filter:drop-shadow(0 0 8px rgba(212,175,55,0.3));"></circle>' +
                '</svg>' +
                '<div class="absolute flex flex-col items-center">' +
                '<span class="text-3xl md:text-4xl font-bold text-gold">' + num + '</span>' +
                '<span class="text-[10px] uppercase tracking-[0.2em] text-gold/40">Days</span>' +
                '</div></div>';
        }

        var left = 
            '<div class="glass-gold rounded-2xl p-6 md:p-8 flex flex-col items-center justify-center min-h-[280px] gold-rise gold-rise-2">' +
                '<h2 class="text-lg md:text-xl font-bold text-gold/60 tracking-[0.15em] uppercase mb-4">Time Remaining</h2>' +
                ring(days) +
                '<div class="mt-6 flex items-center gap-3">' +
                    '<div class="w-2.5 h-2.5 rounded-full pulse-dot-gold"></div>' +
                    '<span class="text-sm text-gold/60 tracking-widest">' + (isActive ? 'ACTIVE' : 'INACTIVE') + '</span>' +
                '</div>' +
            '</div>' +
            '<div class="glass-gold rounded-2xl p-6 flex flex-col gap-4 gold-rise gold-rise-3">' +
                '<div>' +
                    '<div class="flex justify-between items-end mb-2">' +
                        '<span class="text-xs text-gold/40 tracking-widest uppercase">Traffic Used</span>' +
                        '<div class="text-right">' +
                            '<span class="text-xl font-bold text-gold">' + fmt(used) + '</span>' +
                            '<span class="text-sm text-gold/30"> / ' + (limit > 0 ? fmt(limit) : '∞') + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="w-full h-1 bg-gold/5 rounded-full overflow-hidden">' +
                        '<div class="h-full rounded-full" style="width:' + pct.toFixed(1) + '%;background:linear-gradient(90deg,#d4af37,#f0d080);box-shadow:0 0 12px rgba(212,175,55,0.15);"></div>' +
                    '</div>' +
                '</div>' +
                '<hr class="gold-divider"/>' +
                '<div class="flex justify-between">' +
                    '<span class="text-xs text-gold/40 tracking-widest uppercase">Protocol</span>' +
                    '<span class="text-sm font-bold text-gold/80">' + (d.protocol || 'VLESS').toUpperCase() + '</span>' +
                '</div>' +
                '<hr class="gold-divider"/>' +
                '<div class="flex justify-between">' +
                    '<span class="text-xs text-gold/40 tracking-widest uppercase">Devices</span>' +
                    '<span class="text-sm font-bold text-gold/80">' + (d.used_ips != null ? d.used_ips + ' / ' + (d.max_ip_per_user || '∞') : '∞') + '</span>' +
                '</div>' +
            '</div>';

        var cfg = d.config || d.vless_link || '';

        var right = 
            '<div class="glass-gold rounded-2xl p-6 flex-1 flex flex-col gold-rise gold-rise-4">' +
                '<div class="flex justify-between items-center mb-6">' +
                    '<h2 class="text-lg md:text-xl font-bold text-gold/60 tracking-[0.15em] uppercase">Configuration</h2>' +
                    '<div class="flex gap-3">' +
                        (cfg ? '<button onclick="showQr()" class="btn-gold-outline px-4 py-2 rounded-lg text-xs tracking-widest uppercase flex items-center gap-2"><span class="material-symbols-outlined text-lg">qr_code_2</span> QR</button>' : '') +
                        (cfg ? '<button onclick="copyAll()" class="btn-gold px-4 py-2 rounded-lg text-xs tracking-widest uppercase flex items-center gap-2"><span class="material-symbols-outlined text-lg">content_copy</span> Copy</button>' : '') +
                    '</div>' +
                '</div>' +
                '<div class="flex flex-col gap-3 overflow-y-auto pr-2 scroll-gold max-h-[400px]">' +
                    (cfg ? buildStatusBlock(d, uname) : '') +
                    (cfg ? buildConfigBlocks(d) : '') +
                    (cfg ? 
                        '<div class="flex flex-wrap gap-3 mt-4">' +
                            '<button onclick="copySub()" class="btn-gold-outline px-5 py-2.5 rounded-lg text-xs tracking-widest uppercase flex items-center gap-2"><span class="material-symbols-outlined text-lg">link</span> Sub Link</button>' +
                            '<button onclick="importSub()" class="btn-gold px-5 py-2.5 rounded-lg text-xs tracking-widest uppercase flex items-center gap-2"><span class="material-symbols-outlined text-lg">download</span> Import</button>' +
                        '</div>' : '') +
                '</div>' +
            '</div>';

        var app = document.getElementById('app');
        app.innerHTML =
            '<div class="md:col-span-4 flex flex-col gap-6">' + left + '</div>' +
            '<div class="md:col-span-8 flex flex-col">' + right + '</div>';
    }

    function buildStatusBlock(d, uname) {
        var days = (d.expire_days === null || d.expire_days === undefined) ? '∞' : d.expire_days;
        var used = d.traffic_used_bytes || 0;
        var limit = d.traffic_limit_bytes || 0;
        function fmt(b) {
            if (!b || b < 1) return '0 B';
            var u = ['B', 'KB', 'MB', 'GB', 'TB'];
            var i = 0;
            while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
            return b.toFixed(i ? 2 : 0) + ' ' + u[i];
        }
        var pct = limit > 0 ? Math.min(100, used / limit * 100) : 0;
        return '<div class="cfg-card-gold rounded-xl p-4 flex flex-col gap-2 cursor-pointer" onclick="copyStatus()">' +
            '<div class="flex items-center gap-2">' +
                '<span class="material-symbols-outlined text-gold/60 text-lg">schedule</span>' +
                '<span class="text-xs font-bold text-gold/80 tracking-widest uppercase">Status Config</span>' +
            '</div>' +
            '<div class="flex flex-wrap gap-2">' +
                '<span class="gold-tag text-[10px] px-2 py-0.5 rounded-full">⏱ ' + days + ' Days</span>' +
                '<span class="gold-tag text-[10px] px-2 py-0.5 rounded-full">📊 ' + fmt(used) + ' / ' + (limit > 0 ? fmt(limit) : '∞') + '</span>' +
                '<span class="gold-tag text-[10px] px-2 py-0.5 rounded-full">' + pct.toFixed(1) + '%</span>' +
            '</div>' +
            '<span class="text-[10px] text-gold/30 font-mono truncate" dir="ltr">' + (uname || '') + '</span>' +
        '</div>';
    }

    function buildConfigBlocks(d) {
        var cfgs = d.configs || (d.config ? [d.config] : []);
        if (!cfgs.length && d.vless_link) cfgs = [d.vless_link];
        var blocks = '';
        cfgs.forEach(function(c, i) {
            if (!c) return;
            var type = 'VLESS';
            try { var u = new URL(c); type = u.protocol.replace(':', '').toUpperCase(); } catch(e) {}
            var info = c.substring(0, 50) + '...';
            try {
                var u2 = new URL(c);
                var host = u2.hostname || '';
                var port = u2.port || '';
                info = host + (port ? ':' + port : '');
                if (!info) info = c.substring(0, 60);
            } catch(e) {}
            blocks +=
                '<div class="cfg-card-gold rounded-xl p-4 flex justify-between items-center cursor-pointer" onclick="copyCfg(' + i + ')">' +
                    '<div class="flex flex-col gap-1 min-w-0">' +
                        '<div class="flex items-center gap-2">' +
                            '<span class="text-xs font-bold text-gold/80">' + type + ' #' + (i + 1) + '</span>' +
                            '<span class="gold-tag text-[9px] px-1.5 py-0.5 rounded-full">✦</span>' +
                        '</div>' +
                        '<span class="text-[10px] text-gold/30 font-mono truncate max-w-[200px] md:max-w-[400px]" dir="ltr">' + info + '</span>' +
                    '</div>' +
                    '<button class="text-gold/30 hover:text-gold transition-colors p-1" onclick="event.stopPropagation(); copyCfg(' + i + ')">' +
                        '<span class="material-symbols-outlined text-lg">content_copy</span>' +
                    '</button>' +
                '</div>';
        });
        return blocks;
    }

    // ── GLOBALS ──
    var uname = window.location.pathname.split('/').filter(Boolean).pop() || '';
    var subUrl = '';

    window.copyCfg = function(i) {
        var d = window._data || {};
        var cfgs = d.configs || (d.config ? [d.config] : []);
        if (d.vless_link && !cfgs.length) cfgs = [d.vless_link];
        if (cfgs[i]) copyText(cfgs[i]);
    };
    window.copyStatus = function() {
        var d = window._data || {};
        var cfg = d.config || d.vless_link || '';
        if (cfg) copyText(cfg);
    };
    window.copyAll = function() {
        var d = window._data || {};
        var cfgs = d.configs || (d.config ? [d.config] : []);
        if (d.vless_link && !cfgs.length) cfgs = [d.vless_link];
        var txt = cfgs.join('\n');
        if (txt) copyText(txt);
    };
    window.copySub = function() {
        if (subUrl) copyText(subUrl);
    };
    window.importSub = function() {
        if (subUrl) window.open('v2rayng://install-sub?url=' + encodeURIComponent(subUrl), '_blank');
    };
    window.showQr = function() {
        var modal = document.getElementById('qrModal');
        var img = document.getElementById('qrImg');
        if (!modal || !img) return;
        img.src = '/api/sub/' + encodeURIComponent(uname) + '/qr?t=' + Date.now();
        modal.classList.add('show');
    };
    window.closeQr = function() {
        document.getElementById('qrModal').classList.remove('show');
    };

    // ── LOAD ──
    async function load() {
        try {
            var r = await fetch('/api/sub/' + encodeURIComponent(uname));
            if (!r.ok) throw new Error('Not found');
            var d = await r.json();
            window._data = d;
            if (d.config_uuid) subUrl = window.location.origin + '/sub/' + d.config_uuid;
            render(d);
        } catch(e) {
            var app = document.getElementById('app');
            app.innerHTML = 
                '<div class="md:col-span-12 text-center py-20">' +
                    '<span class="material-symbols-outlined text-5xl text-gold/30">diamond</span>' +
                    '<p class="mt-4 text-gold/40 tracking-widest uppercase text-sm">' + e.message + '</p>' +
                '</div>';
        }
    }

    load();
})();
</script>

<style>
    #toast.show { opacity: 1; }
    #qrModal.show { opacity: 1; pointer-events: auto; }
    #qrModal.show img { animation: qrPop 0.3s ease-out; }
    @keyframes qrPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .progress-ring__circle { transition: stroke-dashoffset 0.35s ease; transform: rotate(-90deg); transform-origin: 50% 50%; }
</style>

</body>
</html>
